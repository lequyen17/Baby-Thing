spring.application.name=babything-api

# Giá trị thật lấy từ biến môi trường (xem ../.env.example)

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Schema do schema.sql quản lý, Hibernate không tự sửa bảng
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# SMTP
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App
app.frontend-url=${APP_FRONTEND_URL}
# true khi chạy sau HTTPS (Cloudflare Tunnel), false khi dùng http://localhost
app.cookie-secure=${COOKIE_SECURE:false}
app.mail.from=${MAIL_FROM}
app.mail.enabled=${MAIL_ENABLED}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.jwt.session-max-age=30d
app.otp.ttl=5m
app.otp.max-attempts=5
app.otp.resend-cooldown=60s
app.password-reset.ttl=30m
app.login.max-failures=5
app.login.lock-duration=15m
app.login.otp-enabled=${LOGIN_OTP_ENABLED:true}
# Để trống -> tắt đăng nhập Google
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Cloudflare R2 — để trống bất kỳ biến bắt buộc nào -> tắt upload avatar
app.r2.account-id=${R2_ACCOUNT_ID:}
app.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.r2.bucket-name=${R2_BUCKET_NAME:}
app.r2.public-base-url=${R2_PUBLIC_URL:}

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
