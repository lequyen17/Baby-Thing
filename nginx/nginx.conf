# Gateway duy nhất mở ra ngoài (port 80): /api -> babything-api, còn lại -> babything-ui
server {
    listen 80;
    server_name _;

    # Lấy IP thật của client từ Cloudflare Tunnel, nếu không mọi request đều mang IP của container cloudflared
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Kết nối sự kiện thời gian thực (SSE): giữ mở lâu, không được gom bộ đệm
    location = /api/realtime/stream {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        # Mỗi ảnh tối đa 2 MB; một tin nhắn gửi được 5 ảnh nên cả request tới ~12 MB (khớp max-request-size của api)
        client_max_body_size 13m;
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://ui:80;
        proxy_set_header Host $host;
    }
}
