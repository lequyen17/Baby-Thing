# Build babything-ui và đưa lên GitHub Pages mỗi lần push lên main.
# Cần: Settings -> Pages -> Source = "GitHub Actions"
#       Settings -> Secrets and variables -> Actions -> Variables -> VITE_API_URL = URL backend trên Render
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['babything-ui/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: babything-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: babything-ui/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Pages không có rewrite cho SPA: F5 ở /products trả 404.html, nên 404.html chính là app
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: babything-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
